<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RANGER VIP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: system-ui, Arial, sans-serif;
            background: radial-gradient(circle at top, #5b2cff 0, #12122b 35%, #06070d 100%);
            color: #fff;
            overflow-x: hidden
        }

        body:before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 10%, rgba(255, 90, 200, .12), transparent 25%), radial-gradient(circle at 80% 0%, rgba(0, 183, 255, .14), transparent 25%);
            pointer-events: none
        }

        .wrap {
            max-width: 430px;
            margin: auto;
            padding: 22px
        }

        .card {
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 28px;
            padding: 26px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 0 30px rgba(130, 60, 255, .25);
            text-align: center
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff6b6b, #ff8a00);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 22px auto 18px;
            display: block;
            object-fit: cover;
            border: 4px solid #5bd5ff;
            box-shadow: 0 0 30px #3dbdff
        }

        h1 {
            font-size: 42px;
            background: linear-gradient(90deg, #fff, #8ed8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px
        }

        p {
            color: #c9d2e3;
            line-height: 1.6
        }

        .btn {
            display: block;
            margin: 24px 0;
            padding: 17px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            background: linear-gradient(90deg, #ff6a00, #ff2d95);
            box-shadow: 0 12px 30px rgba(255, 87, 34, .35)
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 22px 0
        }

        .stat {
            background: rgba(255, 255, 255, .06);
            border-radius: 16px;
            padding: 14px
        }

        .stat b {
            display: block;
            color: #7fe4ff;
            font-size: 18px
        }

        .features {
            display: grid;
            gap: 10px;
            margin-top: 16px
        }

        .feature {
            background: rgba(255, 255, 255, .05);
            padding: 14px;
            border-radius: 14px;
            text-align: left
        }

        footer {
            text-align: center;
            color: #94a3b8;
            padding: 22px
        }
    </style>
